# navifzf configuration
# Place this file at ~/.config/navifzf/config.toml

# Navidrome server details
server   = "https://navidrome.example.com"
username = "user"
password = "pass"

# Mark songs as played on the server
scrobble = true

# Selector tool: fzf, dmenu, rofi, or fuzzel
selector = "fzf"

# Player tool: mpv, vlc, or cvlc
player = "mpv"

# Shuffle and loop apply when playing multiple songs
shuffle = true
loop    = true

# Display format (Go templates)
# Artist: .Name, .ID, .AlbumCount, .Genre, .UserRating, .AverageRating
# Album:  .Name, .Artist, .ArtistID, .Year, .SongCount, .Duration, .DurationStr, .Genre
# Song:   .Title, .Artist, .Album, .Track, .TrackStr, .Duration, .DurationStr,
#         .DiscNumber, .Genre, .Year, .Suffix, .ContentType, .Size, .SizeStr,
#         .BitRate, .BitRateStr, .SampleRate, .ChannelCount, .FileType
# artist_format = "{{.Name}} ({{.AlbumCount}} albums)"
# album_format  = "{{.Artist}} - {{.Name}} ({{.Year}}, {{.SongCount}} songs)"
# song_format   = "{{.TrackStr}}. {{.Title}} ({{.DurationStr}})"
